# Job 1002-medallion, as built step by step in laboratorio-1002.html (block 4).
# Same format as the export of job 1001 (Jobs & Pipelines -> job -> (⋮) Edit as YAML):
# serverless notebook tasks point to the environment "Default".
# Paths and warehouse_id belong to the demo workspace: change them in another one.
#
#   bronze_turbines ─┐
#   bronze_scada ────┼──► silver ──► gold
#   bronze_orders ───┘
resources:
  jobs:
    1002_medallion:
      name: 1002-medallion
      tasks:
        - task_key: bronze_scada
          notebook_task:
            notebook_path: /Workspace/Users/test.data.jm@gmail.com/BAC-big-data/lab-1002-medallion/src/01_bronze
            base_parameters:
              source: scada
              run_id: "{{job.run_id}}"
            source: WORKSPACE
          environment_key: Default
        - task_key: bronze_turbines
          notebook_task:
            notebook_path: /Workspace/Users/test.data.jm@gmail.com/BAC-big-data/lab-1002-medallion/src/01_bronze
            base_parameters:
              source: turbines
              run_id: "{{job.run_id}}"
            source: WORKSPACE
          environment_key: Default
        - task_key: bronze_orders
          notebook_task:
            notebook_path: /Workspace/Users/test.data.jm@gmail.com/BAC-big-data/lab-1002-medallion/src/01_bronze
            base_parameters:
              source: work_orders
              run_id: "{{job.run_id}}"
            source: WORKSPACE
          environment_key: Default
        - task_key: silver
          depends_on:
            - task_key: bronze_scada
            - task_key: bronze_turbines
            - task_key: bronze_orders
          notebook_task:
            notebook_path: /Workspace/Users/test.data.jm@gmail.com/BAC-big-data/lab-1002-medallion/src/02_silver
            source: WORKSPACE
          environment_key: Default
        - task_key: gold
          depends_on:
            - task_key: silver
          sql_task:
            file:
              path: /Workspace/Users/test.data.jm@gmail.com/BAC-big-data/lab-1002-medallion/src/03_gold.sql
              source: WORKSPACE
            warehouse_id: 05a06d3bc497d459
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
