# Guion de la guía de laboratorio (motor 05-motores/052-demos-html).
#   python -B 05-motores/052-demos-html/scripts/generar.py <este fichero>
# Consolida el notebook de clase notebook-n1-clase-16-11.ipynb y añade el bloque 4 (los cuatro planes de explain()).
# El código vive en un solo sitio: 01_inmutable_perezoso_y_el_plan.ipynb (codigo: {desde, celda}).
# Los «deberías ver» del bloque 4 salen de una ejecución real en Databricks (captura de Javier, 16.11);
# el resto no está ensayado todavía en Databricks: pendiente de la pasada de capturas.
titulo: Inmutable, perezoso y el plan
kicker: Tema 07 · Laboratorio 2
subtitulo: 'Escribes tu primer programa en Spark, un contador de palabras de <i>Orgullo y prejuicio</i>, a trozos. Por el camino compruebas tres cosas que explican cómo piensa Spark: que nada se modifica, que nada se ejecuta hasta que pides un resultado y que, gracias a eso, Spark reescribe tu código antes de ejecutarlo.'
capturas: capturas
clave: lab0702
modo: apartados
cierre: 'Guarda el notebook: el 23.11 volvemos a él para ver por dentro los jobs que ha creado, con el
  DAG y el Query Profile.'
salida: laboratorio-0702.html
meta:
- <b>7 bloques</b> · unos 60 minutos
- Catálogo <code>lab0702</code> · cómputo <b>Serverless</b>
- Todo el código se copia con un clic
contenido:
- bloque:
    num: '0'
    titulo: Preparar el entorno
    minutos: 8
    concepto: 'Los notebooks del laboratorio vienen en el repositorio del curso, en la carpeta <b>lab-0702-inmutable-perezoso-y-el-plan</b>.
      Un notebook de preparación crea el catálogo <code>lab0702</code> con un volumen donde el bloque 5
      escribe unos CSV pequeños. No usamos el catálogo <code>workspace</code>: no existe en todos los
      workspaces.'
- paso: Pulsa <b>Workspace</b> en la barra lateral, abre <b>Users</b> y entra en tu carpeta (la que lleva
    tu email). Si ya tienes la carpeta <b>BAC-big-data</b> de otro laboratorio, ábrela, pulsa el botón
    con el nombre de la rama (<b>main</b>) y luego <b>Pull</b>; después salta al paso 4.
- paso: Pulsa <b>Create</b> arriba a la derecha y elige <b>Git folder</b>.
- paso:
    texto: En <b>Git repository URL</b> pega la dirección del repositorio y pulsa <b>Create Git folder</b>.
    ver: Una carpeta nueva, <b>BAC-big-data</b>, y dentro la carpeta <b>lab-0702-inmutable-perezoso-y-el-plan</b>
      con los notebooks <code>00_preparar_entorno</code> y <code>01_inmutable_perezoso_y_el_plan</code>.
    url: https://github.com/jmartinezceste/BAC-big-data
- paso:
    texto: Abre el notebook <b>00_preparar_entorno</b>. Comprueba que arriba a la derecha está conectado
      a <b>Serverless</b> y pulsa <b>Run all</b>.
    ver: 'Al final, el mensaje <i>Entorno listo: /Volumes/lab0702/ejercicios/ficheros existe y está vacío.</i>'
- paso:
    texto: Abre el notebook <b>01_inmutable_perezoso_y_el_plan</b>. A partir de aquí, ejecuta las celdas
      una a una con <code>Mayús + Intro</code>, en el orden de esta guía.
    ver: Arriba a la derecha, el cómputo <b>Serverless</b> conectado.
- ayuda: 'Si <b>Run all</b> falla al crear el catálogo con un error de permisos, tu workspace no te deja
    crear catálogos: avisa al docente. Los bloques 1 a 4 y 6 no necesitan el catálogo; si sigue sin funcionar,
    empieza por el bloque 1 y salta el 5.'

- bloque:
    num: '1'
    titulo: Inmutabilidad
    minutos: 5
    concepto: 'Ninguna operación modifica el DataFrame original. <b>Reasignar la variable no es modificar el objeto</b>: como en Python, <code>x = 5; x = x + 1</code> no cambia el 5, crea un 6.'
- paso:
    texto: <b>Un select.</b> Guarda una segunda etiqueta para el DataFrame, haz un <code>select</code> de
      dos columnas y compara.
    ver: '<code>df_original</code> sigue con <b>3 columnas</b>, <code>df</code> tiene 2 y <code>¿Es el mismo
      objeto? False</code>.'
    info: 'El <code>select</code> no ha recortado nada ni ha copiado datos: ha creado un DataFrame nuevo, que es un paso más en un plan. Por eso encadenar transformaciones no cuesta memoria.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 2}
    lenguaje: Python
- paso:
    texto: <b>Un filter.</b> Lo mismo con filas.
    ver: '<code>Filas en base: 10</code> y <code>Filas en filtrado: 5</code>.'
    info: '<code>count()</code> es una <b>acción</b>: lanza trabajo de verdad. Aquí solo la usamos para comprobarlo; en el bloque 6 vemos qué pasa cuando la llamas.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 3}
    lenguaje: Python

- bloque:
    num: '2'
    titulo: Práctica 1 · Leer el texto (Read)
    minutos: '5'
    concepto: 'El hilo del día es contar las palabras de <i>Orgullo y prejuicio</i> en cuatro pasos: <b>Read · Token · Clean · Count</b>. Hoy el texto va en una lista dentro del notebook, así que no hace falta ningún fichero.'
- paso:
    texto: Crea el DataFrame <code>book</code> y mira su esquema.
    ver: 'Al instante: <code>root</code> y <code>|-- value: string (nullable = true)</code>.'
    info: '<code>printSchema()</code> responde sin procesar el texto: Spark ya sabe la forma del resultado. El <b>análisis</b> no espera; la <b>ejecución</b>, sí. Ojo: aquí los datos salen del driver porque los has escrito en el notebook. Con un fichero real, <code>spark.read.text</code> lo leerían los executors directamente del almacenamiento.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 5}
    lenguaje: Python

- bloque:
    num: '3'
    titulo: Práctica 2 · Nada se ejecuta (Token · Clean)
    minutos: 7
    concepto: Cinco transformaciones narrow que trocean y limpian el texto. Cada una devuelve un DataFrame
      nuevo y solo añade un paso al plan.
- paso:
    texto: <b>Token y Clean.</b> Separa las líneas en palabras, pásalas a minúsculas, quédate con las
      letras y quita las vacías.
    ver: 'La celda termina al instante y <b>no imprime nada</b>: no se ha leído ni una línea.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 7}
    lenguaje: Python
- paso:
    texto: <b>El plan.</b> Pide a Spark que te enseñe lo que piensa hacer.
    ver: 'Un bloque <code>== Physical Plan ==</code> con una lista numerada de operadores: la lectura de
      los datos locales (<code>LocalTableScan</code>), un <code>Generate</code> (el <code>explode</code>),
      los <code>Project</code> y el <code>Filter</code>.'
    info: '<code>explain()</code> no es una acción: enseña el plan sin ejecutarlo. En Databricks los nombres pueden empezar por <code>Photon</code> (<code>PhotonProject</code>…): es el motor vectorizado, la idea es la misma.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 8}
    lenguaje: Python

- bloque:
    num: '4'
    titulo: Cómo reescribe Spark tu plan
    minutos: 15
    concepto: Como nada se ejecuta hasta la acción, Spark tiene tu cadena <b>entera</b> delante y puede
      mejorarla antes de mover un byte. Lo vas a ver escribiendo a propósito un plan <b>malo</b> y leyendo
      los cuatro planes por los que pasa.
- flujo:
  - {titulo: Parsed, texto: 'Tu código, tal cual. No comprueba nada'}
  - {titulo: Analyzed, texto: 'Columnas y tipos comprobados'}
  - {titulo: Optimized, texto: 'Catalyst funde, reordena y elimina', 'on': true}
  - {titulo: Physical, texto: 'Cómo se ejecuta: operadores reales'}
- paso:
    texto: <b>Un plan saturado.</b> Una tabla de 1000 filas con un número aleatorio <code>v</code> y una
      columna derivada <code>w = v × 2</code>. Encima, cuatro filtros sobre <code>v</code> que se pisan
      entre sí, uno sobre <code>id</code>, una columna <code>z</code>, un <code>select</code> que deja fuera
      <code>w</code> y un último filtro sobre <code>z</code>.
    ver: 'La celda termina al instante: solo has descrito la receta.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 10}
    lenguaje: Python
- paso:
    texto: <b>Los cuatro planes.</b> Ejecuta <code>explain(mode="extended")</code> y recorre la salida
      de arriba abajo.
    ver: 'Cuatro secciones, en este orden: <code>== Parsed Logical Plan ==</code>, <code>== Analyzed Logical
      Plan ==</code>, <code>== Optimized Logical Plan ==</code> y <code>== Physical Plan ==</code>.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 11}
    lenguaje: Python
- tabla:
    filas:
    - [Plan, Qué buscar, Qué significa]
    - [Parsed, "Los seis Filter apilados, uno por cada .filter(), y columnas con comilla ('v, 'id) y unresolvedstar", "Spark ha traducido tu código sin comprobar nada: todavía no sabe si v existe"]
    - [Analyzed, "El mismo árbol, igual de largo, pero cada columna con su número (v#11066) y su tipo (id: bigint, z: double)", "Columnas y tipos validados. Si una columna no existiera, fallaría aquí, antes de leer una fila"]
    - [Optimized, "Un solo Filter: (v > 0.2) AND (v < 0.95) AND (id % 2 = 0) AND (v * 2.0 + 1.0 > 1.2)", "Catalyst ha fundido los filtros, ha borrado v > 0.10 y v > 0.15 (los cubre v > 0.2), ha sustituido w y z por su fórmula y ha quitado la columna w"]
    - [Physical, "Range, Project y Filter (en Databricks, PhotonRange, PhotonProject, PhotonFilter) en un solo stage", "Lo que se ejecuta de verdad: una pasada, sin pasos intermedios"]
- callout:
    etiqueta: Catalyst no es magia
    texto: 'Fíjate en el último filtro del plan optimizado, <code>v × 2 + 1 &gt; 1,2</code>. Equivale a <code>v &gt; 0,1</code>, y eso ya lo garantiza <code>v &gt; 0,2</code>: el filtro sobra. Aun así, Catalyst no lo quita, porque no hace álgebra. Funde y elimina lo que reconoce por reglas; no razona como tú.'
- paso:
    texto: <b>La misma consulta, limpia.</b> Un solo filtro y la columna <code>z</code> calculada directamente.
      Compara su plan físico con el de <code>df_plan</code>.
    ver: 'Un plan físico con los mismos operadores y las mismas condiciones que el de <code>df_plan</code>.'
    info: 'Moraleja práctica: escribe el código para que se <b>lea</b> bien. Separar filtros o crear columnas intermedias no hace más lento tu programa, porque Catalyst lo reescribe. Lo que sí cuesta es lo que no puede quitar, como pedir columnas que no necesitas al final.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 12}
    lenguaje: Python
- checkpoint: '¿Por qué Spark puede quitar la columna <code>w</code> y fundir los filtros, y pandas no
    podría? Pista: piensa en qué tiene delante cada uno en el momento de ejecutar la primera línea.'

- bloque:
    num: '5'
    titulo: Receta perezosa · leer, transformar, escribir
    minutos: 10
    concepto: 'Una receta corta con un CSV pequeño en el volumen <code>lab0702.ejercicios.ficheros</code>. Montas los pasos y <b>no pasa nada</b> hasta el <code>write</code>: esa es la acción que lanza el trabajo.'
- paso:
    texto: <b>La ruta de esta ejecución.</b> Comprueba que el volumen existe y prepara una carpeta nueva.
    ver: '<code>Directorio de esta ejecución: /Volumes/lab0702/ejercicios/ficheros/…</code> con un identificador
      largo al final.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 14}
    lenguaje: Python
- paso:
    texto: <b>La receta.</b> Escribe un CSV de ejemplo y monta la lectura, el cálculo y la agrupación.
    ver: El plan de <code>resultado</code>, con un <code>HashAggregate</code> y un <code>Exchange</code>
      (el shuffle del <code>groupBy</code>). Aún no hay resultado.
    info: 'La primera línea sí escribe: <code>write</code> es una acción y prepara los datos de entrada. Lo demás solo describe.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 15}
    lenguaje: Python
- paso:
    texto: <b>La acción.</b> El <code>write</code> lanza el trabajo. Después lees el resultado para comprobarlo.
    ver: '<code>{0: 20, 1: 20, 2: 20}</code> y la lista de ficheros de la carpeta <code>resultado</code>,
      con varios <code>part-….csv</code> y un <code>_SUCCESS</code>.'
    info: Cada partición escribe su propio fichero. Por eso un resultado de 3 filas puede quedar repartido
      en varios ficheros.
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 16}
    lenguaje: Python
- ayuda: 'Si falla con <i>No existe /Volumes/lab0702/…</i>, no has ejecutado <code>00_preparar_entorno</code>:
    vuelve al bloque 0. Si sigue sin funcionar, salta al bloque 6: no necesita el volumen.'

- bloque:
    num: '6'
    titulo: Práctica 3 · count() lanza el job (Count)
    minutos: 10
    concepto: Volvemos al contador de palabras. Hasta ahora Spark solo tomaba notas. Una acción pide un
      resultado y <b>nace un job</b>.
- paso:
    texto: '<b>La acción.</b> Cuenta las palabras.'
    ver: 'Un número, y debajo de la celda el enlace <b>See performance</b>: ese es el job que acaba de nacer.'
    info: 'Ábrelo: <b>See performance → Query Profile</b> enseña qué operadores se han ejecutado. En serverless no hay Spark UI.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 18}
    lenguaje: Python
- paso:
    texto: '<b>Contar por palabra.</b> Agrupa y cuenta.'
    ver: '<code>DataFrame[word: string, count: bigint]</code> y ningún enlace <b>See performance</b>: no se ha ejecutado nada.'
    info: '<code>groupBy("word").count()</code> no es una acción: devuelve un DataFrame. El <code>count</code> de dentro es un paso más del plan, y es <b>wide</b>: hará falta un shuffle.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 19}
    lenguaje: Python
- paso:
    texto: <b>El top 10.</b> Ordena y muestra.
    ver: Las 10 palabras más frecuentes del fragmento, con <code>the</code>, <code>of</code> o <code>a</code>
      arriba.
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 21}
    lenguaje: Python
- paso:
    texto: <b>Dos count distintos.</b> Contar filas no es contar grupos, y <code>count(columna)</code>
      ignora los nulos.
    ver: '<code>Grupos: 3</code>, <code>Filas: 120</code>, <code>Filas por grupo</code> con 40 en cada
      categoría y <code>Valores no nulos: 60</code>.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 23}
    lenguaje: Python
- checkpoint: 'Cuenta cuántas acciones has lanzado en este bloque. ¿Cuántos enlaces <b>See performance</b>
    deberías tener?'

- bloque:
    num: Extra
    titulo: Si sobra tiempo · 8 particiones
    minutos: 5
    concepto: En serverless no eliges los núcleos, pero sí cuántas particiones tiene un DataFrame. Con
      <code>spark_partition_id</code> ves cuántas filas caen en cada una.
- paso:
    texto: Crea un DataFrame con 8 particiones y mira el reparto.
    ver: 'Una tabla con las particiones 0 a 7, con <b>1000 filas</b> cada una, y <code>Suma de id: 31996000</code>.'
    info: 'Con 4 núcleos, 8 particiones irían en dos oleadas de 4. En serverless no afirmamos los núcleos: después de la acción, míralo en el Query Profile.'
    codigo: {desde: 01_inmutable_perezoso_y_el_plan.ipynb, celda: 25}
    lenguaje: Python
